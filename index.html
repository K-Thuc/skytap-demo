<!DOCTYPE html>
<html lang="vi">

<meta charset="utf-8">

<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#1d2b3a;--fg:#fff;color-scheme:light dark}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0f1822}}
:root[data-theme="dark"]{--bg:#0f1822}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);overflow:hidden;touch-action:manipulation;-webkit-user-select:none;user-select:none;font-family:'Baloo 2','Be Vietnam Pro',system-ui,sans-serif}
body{display:flex;align-items:center;justify-content:center;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
#wrap{position:relative;flex:none;height:100%;max-width:100%;aspect-ratio:288/512;overflow:hidden;--u:1}
canvas{width:100%;height:100%;display:block}
.b{font:800 calc(15px*var(--u,1)) 'Baloo 2','Be Vietnam Pro',system-ui,sans-serif;background:linear-gradient(#ff8a3d,#e8590c);color:#fff;border:0;border-radius:14px;box-shadow:0 4px 0 #0005;padding:9px 14px;cursor:pointer;margin:4px}
.b:focus-visible,input:focus-visible{outline:3px solid #ffd23f}
.b.off{background:linear-gradient(#7b8296,#586076)}
#skill{position:absolute;right:8px;bottom:68px;display:none;padding:10px 12px}
#menu{position:absolute;top:8px;left:8px;display:none;background:#0009;box-shadow:none;backdrop-filter:blur(4px);font-size:calc(14px*var(--u,1));padding:5px 9px}
#wrap.fpson #menu{top:calc(8px + 26px*var(--u,1))}
#wrap.fpson #pause{top:calc(8px + 64px*var(--u,1))}
#pause{position:absolute;top:calc(8px + 38px*var(--u,1));left:8px;display:none;background:#0009;box-shadow:none;backdrop-filter:blur(4px);font-size:calc(14px*var(--u,1));padding:5px 13px}
#ov{position:absolute;inset:0;display:none;background:#0a1428d9;backdrop-filter:blur(8px);color:#fff;padding:16px max(14px,calc(50% - 260px*var(--u,1)));overflow:auto;font-size:calc(16px*var(--u,1));line-height:1.5;font-weight:600}
#ov h2{font-size:calc(24px*var(--u,1));color:#ffd23f;text-align:center;margin:6px 0 14px}
#ov .row{display:flex;justify-content:space-between;align-items:center;gap:6px;margin:6px 0;background:#ffffff14;border-radius:12px;padding:6px 12px}
#ov input{font:600 calc(16px*var(--u,1)) 'Baloo 2','Be Vietnam Pro',system-ui,sans-serif;width:calc(150px*var(--u,1));padding:9px 12px;background:#fff;color:#222;border:0;border-radius:12px}
#ov .c{text-align:center}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:0 0 10px}
.tabs button{font:800 calc(11px*var(--u,1)) 'Baloo 2','Be Vietnam Pro',system-ui,sans-serif;color:#fff;background:#ffffff14;border:0;border-radius:12px;padding:7px 2px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
.tabs button.on{background:linear-gradient(#ff8a3d,#e8590c);box-shadow:0 3px 0 #0005}
.tabs .ti{font-size:calc(18px*var(--u,1));line-height:1}
.card{background:#ffffff14;border-radius:14px;margin:10px 0;overflow:hidden}
.srow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 14px;border-top:1px solid #ffffff16}
.srow:first-child{border-top:0}
.srow.col{flex-direction:column;align-items:stretch;gap:8px}
.sd{font-size:calc(12px*var(--u,1));opacity:.72;font-weight:600;line-height:1.3}
.sw{flex:none;width:calc(52px*var(--u,1));height:calc(28px*var(--u,1));border-radius:20px;background:#586076;position:relative;border:0;padding:0;cursor:pointer;transition:background .15s}
.sw::after{content:'';position:absolute;top:calc(3px*var(--u,1));left:calc(3px*var(--u,1));width:calc(22px*var(--u,1));height:calc(22px*var(--u,1));border-radius:50%;background:#fff;box-shadow:0 1px 3px #0006;transition:left .15s}
.sw.on{background:linear-gradient(#5ee08a,#2e8b4e)}
.sw.on::after{left:calc(27px*var(--u,1))}
.seg{display:flex;gap:4px;background:#0003;border-radius:12px;padding:3px}
.seg.wrap{flex-wrap:wrap}
.seg button{flex:1 0 auto;font:700 calc(13px*var(--u,1)) 'Baloo 2','Be Vietnam Pro',system-ui,sans-serif;color:#fff;background:transparent;border:0;border-radius:9px;padding:7px 8px;cursor:pointer}
.seg.wrap button{flex:1 0 28%}
.seg button.on{background:linear-gradient(#ff8a3d,#e8590c);box-shadow:0 2px 0 #0005}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pill{background:#0003;border-radius:10px;padding:3px 9px;font-size:calc(12px*var(--u,1));font-weight:700}
.sw:focus-visible,.seg button:focus-visible,.tabs button:focus-visible{outline:3px solid #ffd23f}
.b:active{transform:translateY(3px);box-shadow:0 1px 0 #0005}
@keyframes ovin{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
#ov{animation:ovin .22s ease-out}#ov[data-q="0"]{animation:none}
@media (prefers-reduced-motion:reduce){#ov{animation:none}}
</style>
</head>
